<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Stepper Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 40px; }
  h1 { margin-bottom: 32px; font-size: 20px; font-weight: 600; color: #f0f6fc; }
  .stepper { display: flex; gap: 0; align-items: center; }
  .step { display: flex; flex-direction: column; align-items: center; gap: 8px; position: relative; }
  .circle {
    width: 36px; height: 36px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
    border: 2px solid;
  }
  .step.done .circle { background: #238636; border-color: #238636; color: #fff; }
  .step.running .circle { background: #1f6feb; border-color: #1f6feb; color: #fff; animation: pulse 1.5s infinite; }
  .step.failed .circle { background: #da3633; border-color: #da3633; color: #fff; }
  .step.pending .circle { background: #161b22; border-color: #30363d; color: #484f58; }
  .connector { width: 48px; height: 2px; background: #30363d; }
  .connector.done { background: #238636; }
  .label { font-size: 13px; color: #8b949e; }
  .step.running .label { color: #58a6ff; }
  .step.done .label { color: #3fb950; }
  .duration { font-size: 11px; color: #484f58; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
</style>
</head>
<body>
<h1>Task #{{taskId}} — Stepper Demo</h1>
<div class="stepper">
<!--STEPS-->
</div>
</body>
</html>
